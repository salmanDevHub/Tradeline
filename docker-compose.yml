services:
  postgres:
    image: postgres:16
    environment: { POSTGRES_USER: saas, POSTGRES_PASSWORD: saas, POSTGRES_DB: saas }
    ports: ["5432:5432"]
  redpanda:
    image: redpandadata/redpanda:latest
    command: >
      redpanda start --overprovisioned --smp 1 --memory 512M --reserve-memory 0M
      --node-id 0 --check=false
      --kafka-addr PLAINTEXT://0.0.0.0:9092 --advertise-kafka-addr PLAINTEXT://localhost:9092
    ports: ["9092:9092"]
